<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wachtwoord herstellen - MPOP++</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .reset-wrap { max-width: 560px; margin: 36px auto; }
  </style>
</head>
<body>
  <div class="reset-wrap">
    <h1>Wachtwoord herstellen</h1>
    <div class="card">
      <p class="muted" id="introText">
        Open deze pagina via de link in je herstelmail.
      </p>
      <div id="resetFlowInfo" class="tiny" style="line-height:1.6; margin: 8px 0 12px;">
        <div>Stap 1: Herstellink controleren...</div>
        <div>Stap 2: Recovery-sessie activeren...</div>
        <div>Stap 3: Nieuw wachtwoord opslaan...</div>
        <div>Stap 4: Controle-login uitvoeren...</div>
      </div>

      <form id="resetForm">
        <label for="newPassword">Nieuw wachtwoord</label>
        <input id="newPassword" type="password" autocomplete="new-password" placeholder="Minimaal 6 tekens" />

        <label for="confirmPassword">Herhaal nieuw wachtwoord</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Nogmaals invoeren" />

        <div class="btnrow mt-10">
          <button id="btnSetPassword" type="submit" onclick="window.appendDebug && window.appendDebug('Klik op Wachtwoord opslaan gedetecteerd.')">Wachtwoord opslaan</button>
          <button id="btnBack" type="button" onclick="window.location.href='./index.html'">Terug naar login</button>
        </div>
      </form>

      <div id="resetMsg" class="tiny mt-10"></div>
      <label for="debugLog" class="mt-10">Debug log</label>
      <textarea id="debugLog" readonly style="min-height:220px; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Courier New', monospace;"></textarea>
    </div>
  </div>

  <script>
    (function bootstrapDebug() {
      function ts() {
        return new Date().toISOString();
      }
      function appendDebug(text) {
        var el = document.getElementById("debugLog");
        if (!el) return;
        var line = "[" + ts() + "] " + text;
        el.value = el.value ? el.value + "\n" + line : line;
        el.scrollTop = el.scrollHeight;
      }
      window.appendDebug = appendDebug;
      window.addEventListener("error", function (event) {
        var msg = event && event.message ? event.message : "Onbekende scriptfout";
        appendDebug("window.error: " + msg);
      });
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason ? (event.reason.message || String(event.reason)) : "unknown";
        appendDebug("unhandledrejection: " + reason);
      });
      document.addEventListener("DOMContentLoaded", function () {
        appendDebug("Bootstrap script actief.");
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (async function startResetFlow() {
      try {
        window.appendDebug && window.appendDebug("Reset bootstrap gestart.");
        const supabaseConfig = {
          url: "https://zrcdyzcfsdlmqqwdhctk.supabase.co",
          anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyY2R5emNmc2RsbXFxd2RoY3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxOTgyNzUsImV4cCI6MjA4Mzc3NDI3NX0.voT1eh_FbBkrv7ZMN7B8VRRbrab7tyx3eV6JuXy4ySs"
        };
        const createClient = window.supabase?.createClient;
        if (!createClient) {
          throw new Error("Supabase library kon niet geladen worden via CDN.");
        }
        window.appendDebug && window.appendDebug("Supabase library geladen.");

        const $ = (id) => document.getElementById(id);
        const sb = createClient(supabaseConfig.url, supabaseConfig.anonKey, {
          auth: {
            detectSessionInUrl: true,
            persistSession: true,
            autoRefreshToken: true
          }
        });
    const loginUrl = new URL("./index.html", window.location.href).toString();
    let recoveryReady = false;
    const flowSteps = [
      "Stap 1: Herstellink controleren...",
      "Stap 2: Recovery-sessie activeren...",
      "Stap 3: Nieuw wachtwoord opslaan...",
      "Stap 4: Controle-login uitvoeren..."
    ];

    function msg(text, ok = true) {
      const el = $("resetMsg");
      el.textContent = text || "";
      el.style.color = ok ? "var(--muted)" : "#ffb4b4";
    }
    function nowTs() {
      return new Date().toISOString();
    }
    function logLine(text) {
      const line = `[${nowTs()}] ${text}`;
      if (typeof window.appendDebug === "function") {
        window.appendDebug(text);
      } else {
        const el = $("debugLog");
        el.value = el.value ? `${el.value}\n${line}` : line;
        el.scrollTop = el.scrollHeight;
      }
      console.log(line);
    }
    function safeErr(err) {
      return err?.message || String(err);
    }
    function setStep(step, text, ok = true) {
      const host = $("resetFlowInfo");
      const lines = [...flowSteps];
      lines[step - 1] = text;
      for (let i = 0; i < lines.length; i += 1) {
        flowSteps[i] = lines[i];
      }
      host.innerHTML = flowSteps.map((line) => `<div>${line}</div>`).join("");
      host.style.color = ok ? "var(--muted)" : "#ffb4b4";
    }

    function getHashParams() {
      const hash = window.location.hash?.startsWith("#")
        ? window.location.hash.slice(1)
        : window.location.hash || "";
      return new URLSearchParams(hash);
    }

    function hasRecoveryMarker() {
      const hashParams = getHashParams();
      const queryParams = new URLSearchParams(window.location.search || "");
      return hashParams.get("type") === "recovery" || queryParams.get("type") === "recovery";
    }

    function clearUrlSecrets() {
      const cleanResetUrl = new URL("./reset-password.html", window.location.href).toString();
      window.history.replaceState({}, document.title, cleanResetUrl);
    }

    function setFormEnabled(enabled) {
      $("newPassword").disabled = !enabled;
      $("confirmPassword").disabled = !enabled;
      $("btnSetPassword").disabled = !enabled;
    }

    function goToLogin() {
      window.location.assign(loginUrl);
    }

    async function initRecoveryState() {
      logLine("initRecoveryState gestart.");
      setStep(1, "Stap 1: Herstellink controleren...");
      const hashParams = getHashParams();
      const recoveryError = hashParams.get("error_description") || hashParams.get("error");
      logLine(`URL hash bevat type=${hashParams.get("type") || "(none)"} error=${recoveryError || "(none)"}`);
      if (recoveryError) {
        setFormEnabled(false);
        setStep(1, `Stap 1: Fout in herstellink: ${decodeURIComponent(recoveryError)}`, false);
        msg(`Herstellink fout: ${decodeURIComponent(recoveryError)}`, false);
        logLine(`Herstellink afgekeurd: ${decodeURIComponent(recoveryError)}`);
        return;
      }

      if (!hasRecoveryMarker()) {
        setFormEnabled(false);
        setStep(1, "Stap 1: Geen geldig hersteltype in de URL.", false);
        msg("Geen geldige herstellink gevonden. Open deze pagina vanuit je herstelmail.", false);
        logLine("Geen recovery marker gevonden in hash/query.");
        return;
      }
      setStep(1, "Stap 1: Herstellink is geldig.");
      logLine("Herstellink marker gedetecteerd.");

      const accessToken = hashParams.get("access_token");
      const refreshToken = hashParams.get("refresh_token");
      logLine(`Tokens aanwezig: access_token=${accessToken ? "ja" : "nee"}, refresh_token=${refreshToken ? "ja" : "nee"}`);
      setStep(2, "Stap 2: Recovery-sessie activeren...");
      if (accessToken && refreshToken) {
        logLine("setSession gestart.");
        const { error: setSessionError } = await sb.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });
        if (setSessionError) {
          setFormEnabled(false);
          setStep(2, `Stap 2: Recovery-sessie mislukt: ${setSessionError.message}`, false);
          msg(setSessionError.message || "Kon herstel-sessie niet activeren.", false);
          logLine(`setSession fout: ${safeErr(setSessionError)}`);
          return;
        }
        logLine("setSession gelukt.");
      }

      const { data, error } = await sb.auth.getSession();
      if (error) {
        setFormEnabled(false);
        setStep(2, `Stap 2: Sessiecontrole mislukt: ${error.message || "onbekende fout"}`, false);
        msg(error.message || "Kon herstelstatus niet controleren.", false);
        logLine(`getSession fout: ${safeErr(error)}`);
        return;
      }

      if (data?.session?.user) {
        recoveryReady = true;
        setFormEnabled(true);
        clearUrlSecrets();
        setStep(2, `Stap 2: Recovery-sessie actief voor ${data.session.user.email || "gebruiker"}.`);
        msg("Herstellink is geldig. Vul je nieuwe wachtwoord in.");
        logLine(`Recovery-sessie actief. user_id=${data.session.user.id} email=${data.session.user.email}`);
      } else {
        setFormEnabled(false);
        setStep(2, "Stap 2: Geen actieve recovery-sessie gevonden.", false);
        msg("Herstel-sessie ontbreekt. Open de nieuwste link uit je herstelmail.", false);
        logLine("Geen actieve session.user gevonden na getSession.");
      }
    }

    async function updatePassword(e) {
      e.preventDefault();
      try {
        msg("");
        if (!recoveryReady) throw new Error("Geen actieve herstel-sessie.");

        const password = $("newPassword").value;
        const confirm = $("confirmPassword").value;

        if (!password || password.length < 6) {
          throw new Error("Nieuw wachtwoord moet minimaal 6 tekens zijn.");
        }
        if (password !== confirm) {
          throw new Error("Wachtwoorden komen niet overeen.");
        }

        setStep(3, "Stap 3: Nieuw wachtwoord opslaan...");
        logLine(`updateUser gestart (password length=${password.length}).`);
        const { data: updateData, error } = await sb.auth.updateUser({ password });
        if (error) throw error;

        const recoveryEmail = updateData?.user?.email;
        if (!recoveryEmail) {
          throw new Error("Wachtwoord aangepast, maar e-mailadres ontbreekt voor controle-login.");
        }
        setStep(3, `Stap 3: Wachtwoord opgeslagen voor ${recoveryEmail}.`);
        logLine(`updateUser gelukt voor ${recoveryEmail} (user_id=${updateData?.user?.id || "unknown"}).`);

        await sb.auth.signOut();
        logLine("signOut na updateUser gelukt.");
        setStep(4, "Stap 4: Controle-login uitvoeren...");
        const { error: loginError } = await sb.auth.signInWithPassword({
          email: recoveryEmail,
          password
        });
        if (loginError) {
          logLine(`Controle-login fout: ${safeErr(loginError)}`);
          throw new Error(`Wachtwoord mogelijk niet actief. Controle-login faalde: ${loginError.message}`);
        }

        await sb.auth.signOut();
        setStep(4, "Stap 4: Controle-login geslaagd. Wachtwoord is definitief aangepast.");
        msg(`Wachtwoord is gewijzigd voor ${recoveryEmail}. Je gaat nu terug naar login.`);
        logLine("Controle-login geslaagd met nieuw wachtwoord. Reset flow voltooid.");
        setTimeout(goToLogin, 1400);
      } catch (err) {
        setStep(4, `Stap 4: Fout: ${err.message || String(err)}`, false);
        msg(err.message || String(err), false);
        logLine(`updatePassword fout: ${safeErr(err)}`);
      }
    }

    $("btnBack").addEventListener("click", goToLogin);
    $("resetForm").addEventListener("submit", updatePassword);
    sb.auth.onAuthStateChange((event, session) => {
      logLine(`onAuthStateChange event=${event} user=${session?.user?.email || "(none)"}`);
      if (event === "PASSWORD_RECOVERY") {
        recoveryReady = true;
        setFormEnabled(true);
        msg("Herstellink is geldig. Vul je nieuwe wachtwoord in.");
      }
    });

    setFormEnabled(false);
    logLine(`Pagina geladen. URL=${window.location.href}`);
    initRecoveryState();
      } catch (err) {
        if (window.appendDebug) {
          window.appendDebug(`Reset bootstrap fout: ${err?.message || String(err)}`);
        }
      }
    })();
  </script>
</body>
</html>
