<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maak baal.mp3</title>
<style>
  body{font-family:system-ui;background:#0b0e14;color:#e9effa;margin:16px}
  .panel{max-width:720px;padding:16px;border:1px solid #223;border-radius:14px;background:#0f1420}
  button{padding:12px 16px;border-radius:12px;border:1px solid #223;background:#0b0e14;color:#e9effa;font-weight:800;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  audio{width:100%;margin-top:12px}
  .mono{font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap}
  a{color:#9fd0ff}
</style>
</head>
<body>

<h2>Maak <code>baal.mp3</code> (b + aa + l)</h2>

<div class="panel">
  <p class="mono">
Bron:
- b.mp3
- aa.mp3
- l.mp3

Pad:
https://www.tastenbraille.com/braillestudio/sounds/nl/alfabet/
  </p>

  <button id="run">▶ Maak baal.mp3</button>

  <audio id="player" controls></audio>

  <p>
    <a id="download" download="baal.mp3" style="display:none">Download baal.mp3</a>
  </p>

  <div class="mono" id="log">Idle</div>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

<script>
const { FFmpeg } = FFmpegWASM;
const { fetchFile } = FFmpegUtil;

const BASE = "https://www.tastenbraille.com/braillestudio/sounds/nl/alfabet/";
const FILES = ["b.mp3", "aa.mp3", "l.mp3"];
const OUTPUT = "baal.mp3";
const PAUSE_SECONDS = 0.15;

const logEl = document.getElementById("log");
const player = document.getElementById("player");
const dl = document.getElementById("download");
const btn = document.getElementById("run");

let ffmpeg = null;
let outputUrl = null;

function log(m){ logEl.textContent += "\n" + m; }

async function headOk(url) {
  try {
    const r = await fetch(url, { method: "HEAD", cache: "no-store" });
    return r.ok;
  } catch {
    return false;
  }
}

async function chooseCoreSource() {
  // Prefer local files (same origin) to avoid CDN/worker/CORS "Load failed"
  const local = {
    label: "local",
    coreURL: "../ffmpeg/ffmpeg-core.js",
    wasmURL: "../ffmpeg/ffmpeg-core.wasm",
    workerURL: "../ffmpeg/ffmpeg-core.worker.js",
  };

  const cdnBase = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";
  const cdn = {
    label: "cdn",
    coreURL: `${cdnBase}/ffmpeg-core.js`,
    wasmURL: `${cdnBase}/ffmpeg-core.wasm`,
    workerURL: `${cdnBase}/ffmpeg-core.worker.js`,
  };

  log("Checking local ffmpeg core files...");
  const localCoreOk = await headOk(local.coreURL);
  const localWasmOk = await headOk(local.wasmURL);

  if (localCoreOk && localWasmOk) {
    log("Using local ffmpeg core files (../ffmpeg/).");
    return local;
  }

  log("Local ffmpeg core files not found. Falling back to CDN (unpkg).");
  return cdn;
}

async function ensureFfmpegLoaded() {
  if (ffmpeg) return ffmpeg;

  ffmpeg = new FFmpeg();

  ffmpeg.on("log", ({ message }) => {
    // Uncomment if you want verbose ffmpeg output:
    // log(message);
  });

  const source = await chooseCoreSource();

  log("Loading ffmpeg core (" + source.label + ")...");
  await ffmpeg.load({
    coreURL: source.coreURL,
    wasmURL: source.wasmURL,
  });

  log("ffmpeg loaded.");
  return ffmpeg;
}

btn.onclick = async () => {
  btn.disabled = true;
  logEl.textContent = "Loading ffmpeg...";

  try {
    if (location.protocol === "file:") {
      log("WARNING: file:// may fail. Prefer http://localhost or your website URL.");
    }

    const ff = await ensureFfmpegLoaded();

    log("Fetching source MP3s...");
    for (let i = 0; i < FILES.length; i++) {
      const url = BASE + FILES[i];
      log("Fetch: " + url);
      const data = await fetchFile(url);
      await ff.writeFile(`in${i}.mp3`, data);
    }

    const filter =
      "[0:a]aresample=48000,aformat=fltp:stereo[a0];" +
      "aevalsrc=0:d=" + PAUSE_SECONDS + ":s=48000[s0];" +
      "[1:a]aresample=48000,aformat=fltp:stereo[a1];" +
      "aevalsrc=0:d=" + PAUSE_SECONDS + ":s=48000[s1];" +
      "[2:a]aresample=48000,aformat=fltp:stereo[a2];" +
      "[a0][s0][a1][s1][a2]concat=n=5:v=0:a=1[out]";

    log("Merging into baal.mp3...");

    await ff.exec([
      "-i","in0.mp3",
      "-i","in1.mp3",
      "-i","in2.mp3",
      "-filter_complex", filter,
      "-map","[out]",
      "-c:a","libmp3lame",
      "-b:a","192k",
      "-y",
      OUTPUT
    ]);

    const out = await ff.readFile(OUTPUT);
    const bytes = out instanceof Uint8Array ? out : new Uint8Array(out);

    if (outputUrl) {
      try { URL.revokeObjectURL(outputUrl); } catch {}
      outputUrl = null;
    }

    const blob = new Blob([bytes], { type:"audio/mpeg" });
    outputUrl = URL.createObjectURL(blob);

    player.src = outputUrl;
    dl.href = outputUrl;
    dl.style.display = "inline";

    log("Done ✅ baal.mp3 ready");
  } catch (e) {
    log("ERROR: " + (e?.message || String(e)));
    console.error(e);

    log("");
    log("Troubleshooting:");
    log("1. Open page via http://localhost or your site (not file://)");
    log("2. Put local ffmpeg core files in ../ffmpeg/ (relative to api-elevenlabs/merge.html):");
    log("   - ffmpeg-core.js");
    log("   - ffmpeg-core.wasm");
    log("   - ffmpeg-core.worker.js");
    log("3. If using Safari, test Chrome/Edge to compare");
  } finally {
    btn.disabled = false;
  }
};
</script>

</body>
</html>
