<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Code Scanner</title>

  <style>
    :root {
      --bg: #0b0e14;
      --fg: #e9effa;
      --card: #121826;
      --line: rgba(255,255,255,.15);
      --muted: #a9b6c8;
      --accent: rgba(0, 255, 180, 0.7);
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 16px;
    }

    /* Use a real page grid: header, controls, scanner, output */
    .wrap {
      max-width: 420px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto auto auto;
      row-gap: 16px;
    }

    h1 {
      font-size: 18px;
      margin: 0;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      background: rgba(18,24,38,.55);
      border-radius: 14px;
      /* IMPORTANT: guarantee separation below controls */
      margin-bottom: 8px;
    }

    button {
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--fg);
    }
    button:disabled { opacity: 0.5; }

    /* Scanner card guarantees camera sits LOWER than controls */
    .scannerCard {
      border: 1px solid var(--line);
      background: rgba(18,24,38,.55);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      place-items: center; /* hard center inside the card */
      gap: 12px;
    }

    /* Fixed viewport box for the camera. This prevents "wrong position"
       caused by injected element sizes or flex behavior. */
    #reader {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 3 / 4;      /* portrait-ish camera window */
      border-radius: 14px;
      overflow: hidden;         /* ensures video stays inside */
      background: #000;
    }

    /* html5-qrcode injects a DIV and a VIDEO; force them to fill the box */
    #reader > div,
    #reader video,
    #reader canvas {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }

    #reader video {
      object-fit: cover;        /* center crop */
      object-position: center;  /* always centered */
    }

    /* Scan frame overlay centered within the fixed viewport */
    #reader::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .output {
      border: 1px dashed rgba(255,255,255,.25);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      word-break: break-word;
      min-height: 44px;
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      white-space: pre-line;
      margin-top: -6px;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <h1>QR Code Scanner</h1>

    <div class="controls">
      <button id="startBtn" disabled>Start camera</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="copyBtn" disabled>Copy</button>
    </div>

    <!-- Camera is now inside its own card BELOW controls -->
    <div class="scannerCard">
      <div id="reader"></div>
      <div class="status" id="status">Loading QR library…</div>
    </div>

    <div class="output" id="result">(no result yet)</div>
  </div>

<script>
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("Failed: " + src));
      document.head.appendChild(s);
    });
  }

  async function loadHtml5Qrcode() {
    const url = "https://cdn.jsdelivr.net/npm/html5-qrcode/dist/html5-qrcode.min.js";
    try {
      document.getElementById("status").textContent = "Loading QR library…";
      await loadScript(url);
      return typeof Html5Qrcode === "function";
    } catch {
      return false;
    }
  }

  function vibrate() {
    if (navigator.vibrate) navigator.vibrate(40);
  }

  async function main() {
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn  = document.getElementById("stopBtn");
    const copyBtn  = document.getElementById("copyBtn");
    const resultEl = document.getElementById("result");

    const ok = await loadHtml5Qrcode();
    if (!ok) {
      statusEl.textContent = "❌ QR library failed to load.";
      return;
    }

    statusEl.textContent = "Ready";
    startBtn.disabled = false;

    let qr = null;
    let lastResult = "";

    function setResult(text) {
      lastResult = text;
      resultEl.textContent = text || "(no result yet)";
      copyBtn.disabled = !text;
    }

    async function startScanner() {
      try {
        if (!qr) qr = new Html5Qrcode("reader");

        await qr.start(
          { facingMode: "environment" },
          {
            fps: 15,
            qrbox: { width: 250, height: 250 },
            disableFlip: true
          },
          decodedText => {
            if (decodedText && decodedText !== lastResult) {
              setResult(decodedText);
              statusEl.textContent = "✅ Scanned";
              vibrate();
            }
          },
          () => {}
        );

        startBtn.disabled = true;
        stopBtn.disabled = false;
        statusEl.textContent = "Scanning… Hold QR steady in the frame.";
      } catch (err) {
        statusEl.textContent = "Camera error: " + (err?.message || err);
        alert("Camera error: " + (err?.message || err));
      }
    }

    async function stopScanner() {
      if (!qr) return;
      try { await qr.stop(); await qr.clear(); } catch {}
      startBtn.disabled = false;
      stopBtn.disabled = true;
      statusEl.textContent = "Stopped";
    }

    async function copyResult() {
      try {
        await navigator.clipboard.writeText(lastResult);
        copyBtn.textContent = "Copied!";
        setTimeout(() => (copyBtn.textContent = "Copy"), 800);
      } catch {
        alert("Copy failed");
      }
    }

    startBtn.onclick = startScanner;
    stopBtn.onclick  = stopScanner;
    copyBtn.onclick  = copyResult;
    window.addEventListener("pagehide", stopScanner);
  }

  main();
</script>

</body>
</html>
