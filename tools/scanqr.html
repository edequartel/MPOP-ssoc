<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Code Scanner</title>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: #0b0e14;
      color: #e9effa;
      margin: 16px;
    }
    h1 { font-size: 18px; margin-bottom: 12px; }
    button {
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.15);
      background: #121826;
      color: #e9effa;
      margin-right: 8px;
    }
    button:disabled { opacity: 0.5; }
    #reader {
      width: 100%;
      max-width: 360px;
      margin-top: 12px;
    }
    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 12px;
    }
    #result {
      margin-top: 12px;
      padding: 10px;
      border: 1px dashed rgba(255,255,255,.25);
      border-radius: 10px;
      word-break: break-word;
      min-height: 40px;
    }
    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #a9b6c8;
      white-space: pre-line;
    }
  </style>
</head>
<body>

<h1>QR Code Scanner</h1>

<button id="startBtn" disabled>Start camera</button>
<button id="stopBtn" disabled>Stop</button>
<button id="copyBtn" disabled>Copy</button>

<div id="reader"></div>
<div id="result">(no result yet)</div>
<div id="status">Loading QR library…</div>

<script>
  // ---- Load Html5Qrcode from jsDelivr (no version pin) ----
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("Failed: " + src));
      document.head.appendChild(s);
    });
  }

  async function loadHtml5Qrcode() {
    const url = "https://cdn.jsdelivr.net/npm/html5-qrcode/dist/html5-qrcode.min.js";
    try {
      document.getElementById("status").textContent = "Loading " + url;
      await loadScript(url);
      return typeof Html5Qrcode === "function";
    } catch {
      return false;
    }
  }

  async function main() {
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn  = document.getElementById("stopBtn");
    const copyBtn  = document.getElementById("copyBtn");
    const resultEl = document.getElementById("result");

    const ok = await loadHtml5Qrcode();
    if (!ok) {
      statusEl.textContent =
        "❌ QR library failed to load.\nNetwork may block CDN.";
      return;
    }

    statusEl.textContent = "QR library loaded. Ready.";
    startBtn.disabled = false;

    let qr = null;
    let lastResult = "";

    function setResult(text) {
      lastResult = text;
      resultEl.textContent = text || "(no result yet)";
      copyBtn.disabled = !text;
    }

    async function startScanner() {
      try {
        if (!qr) qr = new Html5Qrcode("reader");

        await qr.start(
          { facingMode: "environment" },
          {
            fps: 15,
            qrbox: { width: 250, height: 250 },
            disableFlip: true
          },
          decodedText => {
            if (decodedText && decodedText !== lastResult) {
              setResult(decodedText);
              statusEl.textContent = "✅ Scanned";
              // Optional: stop after first scan
              // stopScanner();
            }
          },
          () => {} // ignore per-frame decode errors
        );

        startBtn.disabled = true;
        stopBtn.disabled = false;
        statusEl.textContent = "Scanning… Hold QR steady.";
      } catch (err) {
        statusEl.textContent = "Camera error: " + (err?.message || err);
        alert("Camera error: " + (err?.message || err));
      }
    }

    async function stopScanner() {
      if (!qr) return;
      try { await qr.stop(); await qr.clear(); } catch {}
      startBtn.disabled = false;
      stopBtn.disabled = true;
      statusEl.textContent = "Stopped";
    }

    async function copyResult() {
      try {
        await navigator.clipboard.writeText(lastResult);
        copyBtn.textContent = "Copied!";
        setTimeout(() => (copyBtn.textContent = "Copy"), 800);
      } catch {
        alert("Copy failed");
      }
    }

    startBtn.onclick = startScanner;
    stopBtn.onclick  = stopScanner;
    copyBtn.onclick  = copyResult;
    window.addEventListener("pagehide", stopScanner);
  }

  main();
</script>

</body>
</html>
