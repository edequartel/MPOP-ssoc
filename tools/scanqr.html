<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Code Scanner</title>

  <style>
    :root {
      --bg: #0b0e14;
      --fg: #e9effa;
      --card: #121826;
      --line: rgba(255,255,255,.15);
      --muted: #a9b6c8;
      --accent: rgba(0, 255, 180, 0.8);
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 16px;
    }

    .wrap {
      max-width: 420px;
      margin: 0 auto;
      display: grid;
      row-gap: 16px;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 6px;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    .scannerCard {
      border: 1px solid var(--line);
      background: rgba(18,24,38,.55);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      place-items: center;
      gap: 12px;
    }

    /* Fixed viewport box so the camera is ALWAYS in the right place */
    #reader {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 3 / 4;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }

    /* Force injected elements to fill the box */
    #reader > div,
    #reader video,
    #reader canvas {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }

    #reader video {
      object-fit: cover;
      object-position: center;
    }

    /* Scan frame overlay */
    #reader::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 0 999px rgba(0,0,0,0.20) inset;
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      white-space: pre-line;
      margin: 0;
    }

    .result {
      border: 1px dashed rgba(255,255,255,.25);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      word-break: break-word;
      min-height: 44px;
      background: rgba(18,24,38,.35);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      margin: 0;
    }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(18,24,38,.55);
      color: var(--fg);
      font-size: 12px;
      margin-left: 6px;
    }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Scan QR Code</h1>
    <p class="sub">Camera starts automatically <span class="pill" id="modePill">loading…</span></p>
  </header>

  <section class="scannerCard">
    <div id="reader"></div>
    <p class="status" id="status">Loading QR library…</p>
  </section>

  <div class="result" id="result">(no result yet)</div>
  <p class="hint">Tip: hold the QR steady inside the square for 1–2 seconds.</p>
</div>

<script>
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("Failed: " + src));
      document.head.appendChild(s);
    });
  }

  async function loadHtml5Qrcode() {
    const url = "https://cdn.jsdelivr.net/npm/html5-qrcode/dist/html5-qrcode.min.js";
    try {
      document.getElementById("status").textContent = "Loading QR library…";
      await loadScript(url);
      return typeof Html5Qrcode === "function";
    } catch {
      return false;
    }
  }

  function vibrate() {
    if (navigator.vibrate) navigator.vibrate(40);
  }

  async function startAutoScan() {
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const pillEl   = document.getElementById("modePill");

    const ok = await loadHtml5Qrcode();
    if (!ok) {
      pillEl.textContent = "error";
      statusEl.textContent = "❌ QR library failed to load (network blocks CDN).";
      return;
    }

    pillEl.textContent = "auto";
    statusEl.textContent = "Requesting camera permission…";

    let lastResult = "";
    const qr = new Html5Qrcode("reader");

    function setResult(text) {
      lastResult = text;
      resultEl.textContent = text || "(no result yet)";
    }

    try {
      await qr.start(
        { facingMode: "environment" },
        {
          fps: 15,
          qrbox: { width: 250, height: 250 },
          disableFlip: true
        },
        decodedText => {
          if (decodedText && decodedText !== lastResult) {
            setResult(decodedText);
            statusEl.textContent = "✅ Scanned";
            vibrate();

            // Optional: auto-stop after first scan (uncomment)
            // qr.stop().then(() => qr.clear()).catch(() => {});
          }
        },
        () => {}
      );

      statusEl.textContent = "Scanning…";
    } catch (err) {
      pillEl.textContent = "error";
      statusEl.textContent = "Camera error: " + (err?.message || err);
    }

    // Clean up when leaving the page
    window.addEventListener("pagehide", () => {
      qr.stop().then(() => qr.clear()).catch(() => {});
    });
  }

  // Auto-start on load
  startAutoScan();
</script>

</body>
</html>
